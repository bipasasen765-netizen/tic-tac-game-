<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="title">Tic Tac Toe Game</h1>

<!-- input name -->
<div class="start-screen" id="start-screen">
    <h2 class="heading">Enter your name:</h2>
    <input type="text" id="player-name" placeholder="Your name">
    <button id="start-game">Start Game</button>
</div>
<!-- // score board -->
<div class="scoreboard">
<span id="player-score" class="score"> player: 0</span>
<span  id="machine-score" class="score"> machine: 0</span>
<span  id="draw-score" class="score"> draw: 0</span>
</div>

   <div class="container" id="gameboard">

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div> 

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>


    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

   </div> 
<div class="popup" id="popup">
    <div class="popup-content">
        <h2 id="winner-message">you are winner</h2>
        <button id="restart">Restart Game</button>
    </div>
</div>




   <script src="app.js"></script>
</body>
</html>
